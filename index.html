<style>

  /* 화면 머리 */

    font-size: 18px;
    font-weight: 600;
    text-align: right;
    -webkit-user-select: all;

    word-break: break-all;
  }
  .big { font-size: 18px; margin: 0; }
  .text { margin: 0; }
  .text + .text { margin-top: 10px; }

  .list {
    margin: 0;

    margin-top: 12px;

    font-family: inherit;
    font-size: 16px;

  .btn:active { opacity: 0.8; }
  .btn-primary { background: var(--accent); color: #FFFFFF; }

  /* 복사 알림 */

  .sheet-bg {

    display: flex;
    align-items: flex-end;

  .sheet {
    width: 100%;
    max-width: 480px;

  .sheet h3 { margin: 0 0 14px; font-size: 20px; font-weight: 600; }
  .steps { margin: 0; padding: 0; list-style: none; counter-reset: step; }

  .steps li:first-child { border-top: none; }

  }
  .note-box {
    margin: 0;
    padding: 14px 16px;
    background: var(--soft);
    border-radius: 10px;
  }
</style>
</head>

<script>
/* ==================================================================
   여기부터는 고치지 않으셔도 됩니다
   ================================================================== */
(function () {
  "use strict";
  var C = CONFIG;
  var T = C.text || {};

  if (C.accentColor) {
    document.documentElement.style.setProperty("--accent", C.accentColor);
  }
  document.title = C.name || "";

  function fill(tpl, n) {
    return String(tpl || "").replace("{n}", n);
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }

  function linkButton(label, href, cls) {
    var a = el("a", "btn " + (cls || ""), label);
    a.href = href;
    if (/^https?:/i.test(href)) {
      a.target = "_blank";
      a.rel = "noopener";
    }
    return a;
  }

  function actionButton(label, fn, cls) {
    var b = el("button", "btn " + (cls || ""), label);
    b.type = "button";
    b.addEventListener("click", fn);
    return b;
  }

  var toastTimer = null;
  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2000);
  }

  function copyText(text, okMsg) {
    var done = okMsg || T.copied;
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.top = "-1000px";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      toast(ok ? done : T.copyFail);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { toast(done); }, fallback);
    } else {
      fallback();
    }
  }

  function card(title) {
    var c = el("section", "card");
    if (title) c.appendChild(el("h2", "card-title", title));
    return c;
  }

  function row(label, value) {
    var r = el("div", "row");
    r.appendChild(el("div", "row-label", label));
    r.appendChild(el("div", "row-value", value));
    return r;
  }

  function list(items) {
    var ul = el("ul", "list");
    (items || []).forEach(function (t) { ul.appendChild(el("li", "", t)); });
    return ul;
  }

  function naverUrl(q) {
    return "https://map.naver.com/p/search/" + encodeURIComponent(q);
  }

  function header(title) {
    var h = el("header", "screen-head");
    h.appendChild(actionButton(T.back, function () { location.hash = ""; }, "btn-back"));
    h.appendChild(el("h1", "screen-title", title));
    return h;
  }

  function footer(root) {
    if (T.footer) root.appendChild(el("p", "footer", T.footer));
  }

  /* 칸 묶음 그리기 (숙소 소개, 편의시설, 이용 규칙) */
  function renderBlocks(root, blocks) {
    (blocks || []).forEach(function (b) {
      var c = card(b.title);
      (b.text || []).forEach(function (t) { c.appendChild(el("p", "text", t)); });
      if (b.list && b.list.length) c.appendChild(list(b.list));
      root.appendChild(c);
    });
  }

  /* ---------- 홈 화면에 저장 ---------- */
  var INSTALL_KEY = "atmoreddp-install-hidden";
  function isStandalone() {
    return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
  }
  /* 안드로이드 Chrome은 버튼 한 번으로 바로 설치 창이 뜹니다 */
  var installEvent = null;
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); installEvent = e; });
  window.addEventListener("appinstalled", function () {
    try { localStorage.setItem(INSTALL_KEY, "1"); } catch (e) {}
    var b = document.querySelector(".install");
    if (b && b.parentNode) b.parentNode.removeChild(b);
  });
  function deviceInfo() {
    var ua = navigator.userAgent || "";
    var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && "ontouchend" in document);
    return {
      ios: ios,
      iosSafari: ios && /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|Whale|NAVER|KAKAOTALK|Line\/|Instagram|FBAN|FBAV/.test(ua),
      kakao: /KAKAOTALK/i.test(ua),
      line: /Line\//.test(ua),
      inApp: /KAKAOTALK|Instagram|FBAN|FBAV|Line\/|NAVER\(inapp|DaumApps|MicroMessenger|everytimeApp|BAND\//i.test(ua),
      samsung: /SamsungBrowser/i.test(ua)
    };
  }
  function pageUrl() { return location.href.split("#")[0]; }
  function openInBrowser(d) {
    var url = pageUrl();
    if (d.kakao) { location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(url); return; }
    if (d.line) { location.href = url + (url.indexOf("?") < 0 ? "?" : "&") + "openExternalBrowser=1"; return; }
    if (!d.ios && /Android/i.test(navigator.userAgent)) {
      location.href = "intent://" + url.replace(/^https?:\/\//, "") + "#Intent;scheme=https;package=com.android.chrome;end";
      return;
    }
    copyText(url, T.linkCopied);
  }
  function installSheet() {
    var d = deviceInfo();
    var bg = el("div", "sheet-bg");
    function close() { if (bg.parentNode) bg.parentNode.removeChild(bg); }
    bg.addEventListener("click", function (e) { if (e.target === bg) close(); });
    var sheet = el("div", "sheet");
    sheet.setAttribute("role", "dialog");
    sheet.setAttribute("aria-modal", "true");
    sheet.appendChild(el("h3", "", T.installTitle));
    if (d.inApp) {
      sheet.appendChild(el("p", "note-box", T.inAppNote));
      sheet.appendChild(actionButton(T.openBrowser, function () { openInBrowser(d); }, "btn-primary"));
      sheet.appendChild(actionButton(T.copyLink, function () { copyText(pageUrl(), T.linkCopied); }));
    } else if (d.ios && !d.iosSafari) {
      sheet.appendChild(el("p", "note-box", T.iosOther));
      sheet.appendChild(actionButton(T.copyLink, function () { copyText(pageUrl(), T.linkCopied); }, "btn-primary"));
    } else {
      var ol = el("ol", "steps");
      ((d.ios ? T.iosSteps : d.samsung ? T.samsungSteps : T.androidSteps) || []).forEach(function (t) {
        ol.appendChild(el("li", "", t));
      });
      sheet.appendChild(ol);
      if (T.offlineNote) sheet.appendChild(el("p", "hint", T.offlineNote));
    }
    sheet.appendChild(actionButton(T.close, close));
    bg.appendChild(sheet);
    document.body.appendChild(bg);
  }
  function startInstall() {
    if (installEvent) {
      var ev = installEvent;
      installEvent = null;
      ev.prompt();
      if (ev.userChoice) ev.userChoice.then(function (r) { if (!r || r.outcome !== "accepted") installEvent = ev; }, function () {});
      return;
    }
    installSheet();
  }
  function installBanner() {
    var hidden = false;
    try { hidden = localStorage.getItem(INSTALL_KEY) === "1"; } catch (e) {}
    if (hidden || isStandalone() || !T.installText) return null;
    var box = el("div", "install");
    box.appendChild(el("div", "install-text", T.installText));
    var b = el("button", "install-btn", T.installBtn);
    b.type = "button";
    b.addEventListener("click", startInstall);
    box.appendChild(b);
    var x = el("button", "install-x", "×");
    x.type = "button";
    x.setAttribute("aria-label", T.close || "");
    x.addEventListener("click", function () {
      try { localStorage.setItem(INSTALL_KEY, "1"); } catch (e) {}
      if (box.parentNode) box.parentNode.removeChild(box);
    });
    box.appendChild(x);
    return box;
  }

  /* 첫 화면 + 메뉴 */
  function renderHome(root) {
    var photoWrap = el("div", "photo");
    if (C.photo) {
      var img = el("img");
      img.alt = C.photoAlt || "";
      img.onerror = function () {
        if (img.parentNode) img.parentNode.removeChild(img);
      };
      img.src = C.photo;
      photoWrap.appendChild(img);
    }
    root.appendChild(photoWrap);
    root.appendChild(el("h1", "name", C.name));
    if (C.tagline) root.appendChild(el("p", "tagline", C.tagline));

    var facts = [];
    if (C.maxGuests) facts.push(fill(T.summaryGuests, C.maxGuests));
    if (C.bedrooms) facts.push(fill(T.summaryBedrooms, C.bedrooms));
    if (C.beds) facts.push(fill(T.summaryBeds, C.beds));
    if (C.bathrooms) facts.push(fill(T.summaryBathrooms, C.bathrooms));
    if (facts.length) root.appendChild(el("p", "facts", facts.join(T.summarySeparator || " ")));

    var install = installBanner();
    if (install) root.appendChild(install);

    var menu = el("nav", "menu");
    menu.setAttribute("aria-label", T.menuTitle || "");
    [
      ["#checkin", T.menuCheckin],
      ["#wifi", T.menuWifi],
      ["#about", T.menuAbout],
      ["#amenities", T.menuAmenities],
      ["#rules", T.menuRules],
      ["#nearby", T.menuNearby],
      ["#emergency", T.menuEmergency],
      ["#contact", T.menuContact]
    ].forEach(function (m) {
      var a = el("a", "tile", m[1]);
      a.href = m[0];
      menu.appendChild(a);
    });
    root.appendChild(menu);
  }

  /* 체크인 */
  function renderCheckin(root) {
    root.appendChild(header(T.checkinTitle));

    var cTime = card(T.timeLabel);
    cTime.appendChild(row(T.checkinLabel, C.checkinTime));
    cTime.appendChild(row(T.checkoutLabel, C.checkoutTime));
    root.appendChild(cTime);

    var cAddr = card(T.addressLabel);
    cAddr.appendChild(el("p", "big", C.address));
    cAddr.appendChild(actionButton(T.copyAddress, function () { copyText(C.address); }, "btn-primary"));
    root.appendChild(cAddr);

    if (C.transit && C.transit.length) {
      var cTr = card(T.transitLabel);
      cTr.appendChild(list(C.transit));
      root.appendChild(cTr);
    }

    var q = encodeURIComponent(C.mapQuery || C.address || "");
    var cMap = card(T.openMapLabel);
    cMap.appendChild(linkButton(T.naverMap, "https://map.naver.com/p/search/" + q));
    cMap.appendChild(linkButton(T.kakaoMap, "https://map.kakao.com/link/search/" + q));
    cMap.appendChild(linkButton(T.googleMap, "https://www.google.com/maps/search/?api=1&query=" + q));
    root.appendChild(cMap);

    var cDoor = card(T.doorLabel);
    cDoor.appendChild(el("p", "text", C.doorGuide));
    root.appendChild(cDoor);

    if (C.luggage) {
      var cLug = card(T.luggageLabel);
      cLug.appendChild(el("p", "text", C.luggage));
      root.appendChild(cLug);
    }
  }

  /* 와이파이 */
  function renderWifi(root) {
    root.appendChild(header(T.wifiTitle));
    var c = card(T.wifiTitle);
    c.appendChild(row(T.wifiNameLabel, C.wifiName));
    c.appendChild(row(T.wifiPasswordLabel, C.wifiPassword));
    c.appendChild(actionButton(T.copyPassword, function () { copyText(C.wifiPassword); }, "btn-primary"));
    root.appendChild(c);
  }

  /* 숙소 소개 */
  function renderAbout(root) {
    root.appendChild(header(T.aboutTitle));
    renderBlocks(root, C.about);
  }

  /* 편의시설 */
  function renderAmenities(root) {
    root.appendChild(header(T.amenitiesTitle));
    renderBlocks(root, C.amenities);
  }

  /* 이용 규칙 */
  function renderRules(root) {
    root.appendChild(header(T.rulesTitle));
    renderBlocks(root, C.rules);
  }

  /* 주변 정보 */
  function renderNearby(root) {
    root.appendChild(header(T.nearbyTitle));
    (C.places || []).forEach(function (p) {
      var c = card("");
      c.appendChild(el("p", "place-name", p.name));
      if (p.desc) c.appendChild(el("p", "text", p.desc));
      if (p.query) c.appendChild(linkButton(T.placeMap, naverUrl(p.query)));
      root.appendChild(c);
    });
    if (C.subway && C.subway.length) {
      var cS = card(T.subwayLabel);
      cS.appendChild(list(C.subway));
      root.appendChild(cS);
    }
    if (C.uberOn) {
      var base = "https://m.uber.com/ul/?action=setPickup&pickup=my_location";
      var cU = card(T.taxiLabel);
      if (T.taxiIntro) cU.appendChild(el("p", "text", T.taxiIntro));
      cU.appendChild(linkButton(T.uberPickup, base, "btn-primary"));
      if (C.uberLat && C.uberLng) {
        var home = base +
          "&dropoff[latitude]=" + encodeURIComponent(C.uberLat) +
          "&dropoff[longitude]=" + encodeURIComponent(C.uberLng) +
          "&dropoff[nickname]=" + encodeURIComponent(C.name || "") +
          "&dropoff[formatted_address]=" + encodeURIComponent(C.address || "");
        cU.appendChild(linkButton(T.uberHome, home));
      }
      root.appendChild(cU);
    }
    if (C.kakaoTOn) {
      var cT = card(C.uberOn ? "" : T.taxiLabel);
      cT.appendChild(actionButton(T.kakaoT, openKakaoT, "btn-primary"));
      if (T.kakaoTHint) cT.appendChild(el("p", "hint", T.kakaoTHint));
      root.appendChild(cT);
    }
  }

  /* 카카오T 열기. 앱이 없으면 설치 화면으로 */
  function openKakaoT() {
    var ua = navigator.userAgent || "";
    var store = /iPhone|iPad|iPod/i.test(ua)
      ? "https://apps.apple.com/kr/app/id981110422"
      : "https://play.google.com/store/apps/details?id=com.kakao.taxi";
    var left = false;
    function onHide() { if (document.hidden) left = true; }
    document.addEventListener("visibilitychange", onHide);
    window.location.href = "kakaot://";
    setTimeout(function () {
      document.removeEventListener("visibilitychange", onHide);
      if (!left && !document.hidden) window.location.href = store;
    }, 1500);
  }

  /* 긴급 연락 */
  function renderEmergency(root) {
    root.appendChild(header(T.emergencyTitle));
    if (T.emergencyIntro) {
      var cI = card("");
      cI.appendChild(el("p", "text", T.emergencyIntro));
      cI.appendChild(linkButton(T.emergencyContact, "#contact"));
      root.appendChild(cI);
    }
    (C.emergency || []).forEach(function (e) {
      var c = card(e.desc);
      c.appendChild(linkButton(e.label, "tel:" + String(e.number).replace(/[^0-9+]/g, ""), "btn-primary"));
      root.appendChild(c);
    });
  }

  /* 연락하기 */
  function renderContact(root) {
    root.appendChild(header(T.contactTitle));

    var cHost = card(C.hostName);
    if (T.contactIntro) cHost.appendChild(el("p", "text", T.contactIntro));
    root.appendChild(cHost);

    var any = false;

    if (C.kakaoId || C.kakaoOpenChatUrl) {
      any = true;
      var cK = card(T.kakaoLabel);
      if (C.kakaoId) cK.appendChild(row(T.kakaoIdLabel, C.kakaoId));
      if (C.kakaoOpenChatUrl) cK.appendChild(linkButton(T.kakaoOpen, C.kakaoOpenChatUrl, "btn-primary"));
      if (C.kakaoId) {
        cK.appendChild(actionButton(T.kakaoCopy, function () { copyText(C.kakaoId); }, C.kakaoOpenChatUrl ? "" : "btn-primary"));
        cK.appendChild(el("p", "hint", T.kakaoHint));
      }
      root.appendChild(cK);
    }

    if (C.lineId) {
      any = true;
      var cL = card(T.lineLabel);
      cL.appendChild(row(T.lineIdLabel, C.lineId));
      cL.appendChild(linkButton(T.lineOpen, "https://line.me/ti/p/~" + encodeURIComponent(C.lineId), "btn-primary"));
      root.appendChild(cL);
    }

    if (C.whatsappNumber) {
      any = true;
      var cW = card(T.whatsappLabel);
      cW.appendChild(linkButton(T.whatsappOpen, "https://wa.me/" + String(C.whatsappNumber).replace(/[^0-9]/g, ""), "btn-primary"));
      root.appendChild(cW);
    }

    if (C.phone) {
      any = true;
      var cP = card(T.phoneLabel);
      cP.appendChild(linkButton(T.phoneCall, "tel:" + String(C.phone).replace(/[^0-9+]/g, ""), "btn-primary"));
      root.appendChild(cP);
    }

    if (!any) {
      var cN = card("");
      cN.appendChild(el("p", "text", T.noContact));
      root.appendChild(cN);
    }
  }

  var screens = {
    "": renderHome,
    "checkin": renderCheckin,
    "wifi": renderWifi,
    "about": renderAbout,
    "amenities": renderAmenities,
    "rules": renderRules,
    "nearby": renderNearby,
    "emergency": renderEmergency,
    "contact": renderContact
  };

  function route() {
    var key = location.hash.replace("#", "");
    var fn = screens[key] || renderHome;
    var app = document.getElementById("app");
    app.innerHTML = "";
    var screen = el("main", "screen");
    try {
      fn(screen);
    } catch (e) {
      screen.innerHTML = "";
      renderHome(screen);
    }
    if (fn !== renderHome) footer(screen);
    app.appendChild(screen);
    window.scrollTo(0, 0);
  }

  window.addEventListener("hashchange", route);
  route();

  /* 홈 화면 저장과 인터넷 없이 열기에 필요한 장치 */
  if ("serviceWorker" in navigator && /^https?:/.test(location.protocol)) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
})();
</script>
</body>
</html>
