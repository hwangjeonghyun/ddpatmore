<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title></title>

<script>
/* ==================================================================
   ##################################################################
   ##                                                              ##
   ##                     여기만 고치세요                           ##
   ##                                                              ##
   ##   숙소 정보와 화면에 나오는 모든 글자가 이 CONFIG 안에 있습니다. ##
   ##   큰따옴표 " " 안의 글자만 바꾸세요.                          ##
   ##   쉼표 , 와 따옴표 " 는 지우지 마세요.                        ##
   ##                                                              ##
   ##################################################################
   ================================================================== */
const CONFIG = {

  /* ---------- 색 ---------- */
  accentColor: "#6B7F6A", // 강조색. 버튼, 제목, 메뉴 글자 색이 모두 이 색으로 바뀝니다

  /* ---------- 첫 화면 ---------- */
  name: "at more ddp", // 숙소 이름. 첫 화면 큰 글자와 브라우저 탭 이름에 나옵니다
  tagline: "stay more. feel more. remember more.", // 한 줄 소개. 숙소 이름 바로 아래에 나옵니다
  photo: "img/main.jpg", // 첫 화면 사진 위치. img 폴더에 main.jpg 를 넣으면 나옵니다. 없으면 회색 칸으로 보입니다
  photoAlt: "at more ddp 숙소 사진", // 사진이 안 보일 때 대신 읽히는 설명

  /* ---------- 숙소 규모 (첫 화면 사진 아래 한 줄) ---------- */
  maxGuests: "6", // 최대 인원
  bedrooms: "2", // 침실 수
  beds: "3", // 침대 수
  bathrooms: "1.5", // 욕실 수

  /* ---------- 체크인 화면 ---------- */
  address: "서울특별시 중구 쌍림동 210-2 5층", // 주소. 체크인 화면에 나오고 "주소 복사" 버튼으로 복사됩니다
  mapQuery: "서울특별시 중구 쌍림동 210-2", // 지도 앱에서 검색할 주소. 층수를 빼야 지도에서 잘 찾아집니다
  checkinTime: "16:00", // 체크인 시각. 이 값을 바꾸면 앱 전체에 반영됩니다
  checkoutTime: "11:00", // 체크아웃 시각. 이 값을 바꾸면 앱 전체에 반영됩니다
  doorGuide: "1층 공동현관과 5층 객실 비밀번호는 체크인 당일 오후 3시쯤 메시지로 보내 드립니다. 5층 비밀번호는 게스트가 바뀔 때마다 새로 바뀝니다.", // 현관 여는 법. 실제 비밀번호는 절대 넣지 마세요

  /* ---------- 와이파이 화면 ---------- */
  wifiName: "atmore_ddp_5G", // 와이파이 이름 [샘플입니다. 바꿔 주세요]
  wifiPassword: "sample1234", // 와이파이 비밀번호. "비밀번호 복사" 버튼으로 복사됩니다 [샘플입니다. 바꿔 주세요]

  /* ---------- 연락하기 화면 (비워 두면 그 버튼은 안 보입니다) ---------- */
  hostName: "현", // 연락하기 화면 맨 위에 나오는 이름
  kakaoId: "Hyun_hd", // 카카오톡 아이디. "아이디 복사" 버튼이 생깁니다
  kakaoOpenChatUrl: "", // 카카오 오픈채팅 주소. 넣으면 누르자마자 카카오톡이 열리는 버튼이 생깁니다. 예: "https://open.kakao.com/o/xxxx"
  lineId: "atmorehyun", // LINE 아이디. 누르면 LINE 친구 추가 화면이 열립니다
  whatsappNumber: "", // WhatsApp 번호. 국가번호 포함 숫자만. 예: "821012345678". 비워 두면 안 보입니다
  phone: "", // 전화번호. 비워 두면 전화 버튼이 안 보입니다

  /* ---------- 화면에 나오는 글자 ---------- */
  text: {
    summaryGuests: "최대 {n}명", // 첫 화면 규모 줄. {n} 자리에 최대 인원이 들어갑니다
    summaryBedrooms: "침실 {n}", // {n} 자리에 침실 수가 들어갑니다
    summaryBeds: "침대 {n}", // {n} 자리에 침대 수가 들어갑니다
    summaryBathrooms: "욕실 {n}", // {n} 자리에 욕실 수가 들어갑니다
    summarySeparator: "  |  ", // 규모 항목 사이에 들어가는 구분 글자

    menuTitle: "안내 메뉴", // 메뉴 묶음 이름 (화면 읽기 기능용)
    menuCheckin: "체크인", // 메뉴 버튼 글자
    menuWifi: "와이파이", // 메뉴 버튼 글자
    menuContact: "연락하기", // 메뉴 버튼 글자
    back: "메뉴로 돌아가기", // 각 화면 위쪽 돌아가기 버튼 글자

    checkinTitle: "체크인", // 체크인 화면 제목
    timeLabel: "시간", // 시간 칸 제목
    checkinLabel: "체크인", // 체크인 시각 앞 글자
    checkoutLabel: "체크아웃", // 체크아웃 시각 앞 글자
    addressLabel: "주소", // 주소 칸 제목
    copyAddress: "주소 복사", // 주소 복사 버튼 글자
    openMapLabel: "지도 앱으로 열기", // 지도 칸 제목
    naverMap: "네이버 지도", // 지도 버튼 글자
    kakaoMap: "카카오맵", // 지도 버튼 글자
    googleMap: "Google 지도", // 지도 버튼 글자
    doorLabel: "현관 여는 법", // 현관 안내 칸 제목

    wifiTitle: "와이파이", // 와이파이 화면 제목
    wifiNameLabel: "이름", // 와이파이 이름 앞 글자
    wifiPasswordLabel: "비밀번호", // 와이파이 비밀번호 앞 글자
    copyPassword: "비밀번호 복사", // 비밀번호 복사 버튼 글자

    contactTitle: "연락하기", // 연락하기 화면 제목
    contactIntro: "필요한 것이 있으면 메시지를 남겨 주세요.", // 이름 아래 안내 문장
    kakaoLabel: "카카오톡", // 카카오톡 칸 제목
    kakaoIdLabel: "아이디", // 카카오톡 아이디 앞 글자
    kakaoCopy: "카카오톡 아이디 복사", // 카카오톡 아이디 복사 버튼 글자
    kakaoOpen: "카카오톡으로 열기", // 오픈채팅 버튼 글자
    kakaoHint: "카카오톡 > 친구 추가 > ID 검색에 붙여넣어 주세요.", // 아이디 복사 버튼 아래 도움말
    lineLabel: "LINE", // LINE 칸 제목
    lineIdLabel: "아이디", // LINE 아이디 앞 글자
    lineOpen: "LINE으로 열기", // LINE 버튼 글자
    whatsappLabel: "WhatsApp", // WhatsApp 칸 제목
    whatsappOpen: "WhatsApp으로 열기", // WhatsApp 버튼 글자
    phoneLabel: "전화", // 전화 칸 제목
    phoneCall: "전화하기", // 전화 버튼 글자
    noContact: "연락처가 아직 없습니다.", // 연락처를 하나도 넣지 않았을 때 나오는 글자

    copied: "복사했습니다", // 복사 성공 시 아래에 잠깐 나오는 글자
    copyFail: "복사하지 못했습니다. 글자를 길게 눌러 복사해 주세요." // 복사 실패 시 나오는 글자
  }
};
/* ==================================================================
   여기까지만 고치세요
   ================================================================== */
</script>

<!-- ==================================================================
     여기부터는 고치지 않으셔도 됩니다
     ================================================================== -->
<style>
  :root {
    --accent: #6B7F6A;
    --text: #222222;
    --muted: #6B6B6B;
    --line: #ECECEC;
    --soft: #F4F5F3;
    --shadow: 0 1px 6px rgba(0, 0, 0, 0.06);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: #FFFFFF;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    word-break: keep-all;
    overflow-wrap: break-word;
  }
  .screen {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 56px;
  }

  /* 첫 화면 */
  .photo {
    width: 100%;
    aspect-ratio: 4 / 3;
    border-radius: 14px;
    overflow: hidden;
    background: var(--soft);
  }
  .photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .name {
    font-size: 30px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 22px 0 4px;
    line-height: 1.3;
  }
  .tagline {
    margin: 0;
    color: var(--muted);
    font-size: 16px;
  }
  .facts {
    margin: 14px 0 0;
    font-size: 16px;
    white-space: pre-wrap;
  }

  /* 메뉴 */
  .menu {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 28px;
  }
  .tile {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 96px;
    padding: 16px;
    background: #FFFFFF;
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    color: var(--accent);
    font-size: 18px;
    font-weight: 600;
    text-decoration: none;
    text-align: center;
  }
  .tile:active { background: var(--soft); }

  /* 화면 머리 */
  .screen-head { margin-bottom: 18px; }
  .screen-title {
    font-size: 26px;
    font-weight: 600;
    margin: 18px 0 0;
    line-height: 1.3;
  }

  /* 카드 */
  .card {
    background: #FFFFFF;
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 18px 16px;
    margin-bottom: 14px;
  }
  .card-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--accent);
    margin: 0 0 10px;
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding: 10px 0;
    border-top: 1px solid var(--line);
  }
  .card-title + .row { border-top: none; padding-top: 0; }
  .row-label { color: var(--muted); flex-shrink: 0; }
  .row-value {
    font-size: 18px;
    font-weight: 600;
    text-align: right;
    -webkit-user-select: all;
    user-select: all;
    word-break: break-all;
  }
  .big { font-size: 18px; margin: 0; }
  .text { margin: 0; }
  .hint { margin: 10px 0 0; color: var(--muted); font-size: 16px; }

  /* 버튼 */
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 48px;
    padding: 12px 16px;
    margin-top: 12px;
    border-radius: 8px;
    border: 1px solid var(--accent);
    background: #FFFFFF;
    color: var(--accent);
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    text-align: center;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
  }
  .btn:active { opacity: 0.8; }
  .btn-primary { background: var(--accent); color: #FFFFFF; }
  .btn-back {
    width: auto;
    display: inline-flex;
    margin-top: 0;
    border-color: var(--line);
    color: var(--text);
  }

  /* 복사 알림 */
  #toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    max-width: calc(100% - 32px);
    background: #222222;
    color: #FFFFFF;
    padding: 12px 18px;
    border-radius: 8px;
    font-size: 16px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    text-align: center;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ==================================================================
   여기부터는 고치지 않으셔도 됩니다
   ================================================================== */
(function () {
  "use strict";
  var C = CONFIG;
  var T = C.text || {};

  if (C.accentColor) {
    document.documentElement.style.setProperty("--accent", C.accentColor);
  }
  document.title = C.name || "";

  function fill(tpl, n) {
    return String(tpl || "").replace("{n}", n);
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }

  function linkButton(label, href, cls) {
    var a = el("a", "btn " + (cls || ""), label);
    a.href = href;
    if (/^https?:/i.test(href)) {
      a.target = "_blank";
      a.rel = "noopener";
    }
    return a;
  }

  function actionButton(label, fn, cls) {
    var b = el("button", "btn " + (cls || ""), label);
    b.type = "button";
    b.addEventListener("click", fn);
    return b;
  }

  var toastTimer = null;
  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2000);
  }

  function copyText(text) {
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.top = "-1000px";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      toast(ok ? T.copied : T.copyFail);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { toast(T.copied); }, fallback);
    } else {
      fallback();
    }
  }

  function card(title) {
    var c = el("section", "card");
    if (title) c.appendChild(el("h2", "card-title", title));
    return c;
  }

  function row(label, value) {
    var r = el("div", "row");
    r.appendChild(el("div", "row-label", label));
    r.appendChild(el("div", "row-value", value));
    return r;
  }

  function header(title) {
    var h = el("header", "screen-head");
    h.appendChild(actionButton(T.back, function () { location.hash = ""; }, "btn-back"));
    h.appendChild(el("h1", "screen-title", title));
    return h;
  }

  /* 첫 화면 + 메뉴 */
  function renderHome(root) {
    var photoWrap = el("div", "photo");
    if (C.photo) {
      var img = el("img");
      img.alt = C.photoAlt || "";
      img.onerror = function () {
        if (img.parentNode) img.parentNode.removeChild(img);
      };
      img.src = C.photo;
      photoWrap.appendChild(img);
    }
    root.appendChild(photoWrap);
    root.appendChild(el("h1", "name", C.name));
    if (C.tagline) root.appendChild(el("p", "tagline", C.tagline));

    var facts = [];
    if (C.maxGuests) facts.push(fill(T.summaryGuests, C.maxGuests));
    if (C.bedrooms) facts.push(fill(T.summaryBedrooms, C.bedrooms));
    if (C.beds) facts.push(fill(T.summaryBeds, C.beds));
    if (C.bathrooms) facts.push(fill(T.summaryBathrooms, C.bathrooms));
    if (facts.length) root.appendChild(el("p", "facts", facts.join(T.summarySeparator || " ")));

    var menu = el("nav", "menu");
    menu.setAttribute("aria-label", T.menuTitle || "");
    [["#checkin", T.menuCheckin], ["#wifi", T.menuWifi], ["#contact", T.menuContact]].forEach(function (m) {
      var a = el("a", "tile", m[1]);
      a.href = m[0];
      menu.appendChild(a);
    });
    root.appendChild(menu);
  }

  /* 체크인 */
  function renderCheckin(root) {
    root.appendChild(header(T.checkinTitle));

    var cTime = card(T.timeLabel);
    cTime.appendChild(row(T.checkinLabel, C.checkinTime));
    cTime.appendChild(row(T.checkoutLabel, C.checkoutTime));
    root.appendChild(cTime);

    var cAddr = card(T.addressLabel);
    cAddr.appendChild(el("p", "big", C.address));
    cAddr.appendChild(actionButton(T.copyAddress, function () { copyText(C.address); }, "btn-primary"));
    root.appendChild(cAddr);

    var q = encodeURIComponent(C.mapQuery || C.address || "");
    var cMap = card(T.openMapLabel);
    cMap.appendChild(linkButton(T.naverMap, "https://map.naver.com/p/search/" + q));
    cMap.appendChild(linkButton(T.kakaoMap, "https://map.kakao.com/link/search/" + q));
    cMap.appendChild(linkButton(T.googleMap, "https://www.google.com/maps/search/?api=1&query=" + q));
    root.appendChild(cMap);

    var cDoor = card(T.doorLabel);
    cDoor.appendChild(el("p", "text", C.doorGuide));
    root.appendChild(cDoor);
  }

  /* 와이파이 */
  function renderWifi(root) {
    root.appendChild(header(T.wifiTitle));
    var c = card(T.wifiTitle);
    c.appendChild(row(T.wifiNameLabel, C.wifiName));
    c.appendChild(row(T.wifiPasswordLabel, C.wifiPassword));
    c.appendChild(actionButton(T.copyPassword, function () { copyText(C.wifiPassword); }, "btn-primary"));
    root.appendChild(c);
  }

  /* 연락하기 */
  function renderContact(root) {
    root.appendChild(header(T.contactTitle));

    var cHost = card(C.hostName);
    if (T.contactIntro) cHost.appendChild(el("p", "text", T.contactIntro));
    root.appendChild(cHost);

    var any = false;

    if (C.kakaoId || C.kakaoOpenChatUrl) {
      any = true;
      var cK = card(T.kakaoLabel);
      if (C.kakaoId) cK.appendChild(row(T.kakaoIdLabel, C.kakaoId));
      if (C.kakaoOpenChatUrl) cK.appendChild(linkButton(T.kakaoOpen, C.kakaoOpenChatUrl, "btn-primary"));
      if (C.kakaoId) {
        cK.appendChild(actionButton(T.kakaoCopy, function () { copyText(C.kakaoId); }, C.kakaoOpenChatUrl ? "" : "btn-primary"));
        cK.appendChild(el("p", "hint", T.kakaoHint));
      }
      root.appendChild(cK);
    }

    if (C.lineId) {
      any = true;
      var cL = card(T.lineLabel);
      cL.appendChild(row(T.lineIdLabel, C.lineId));
      cL.appendChild(linkButton(T.lineOpen, "https://line.me/ti/p/~" + encodeURIComponent(C.lineId), "btn-primary"));
      root.appendChild(cL);
    }

    if (C.whatsappNumber) {
      any = true;
      var cW = card(T.whatsappLabel);
      cW.appendChild(linkButton(T.whatsappOpen, "https://wa.me/" + String(C.whatsappNumber).replace(/[^0-9]/g, ""), "btn-primary"));
      root.appendChild(cW);
    }

    if (C.phone) {
      any = true;
      var cP = card(T.phoneLabel);
      cP.appendChild(linkButton(T.phoneCall, "tel:" + String(C.phone).replace(/[^0-9+]/g, ""), "btn-primary"));
      root.appendChild(cP);
    }

    if (!any) {
      var cN = card("");
      cN.appendChild(el("p", "text", T.noContact));
      root.appendChild(cN);
    }
  }

  var screens = {
    "": renderHome,
    "checkin": renderCheckin,
    "wifi": renderWifi,
    "contact": renderContact
  };

  function route() {
    var key = location.hash.replace("#", "");
    var fn = screens[key] || renderHome;
    var app = document.getElementById("app");
    app.innerHTML = "";
    var screen = el("main", "screen");
    try {
      fn(screen);
    } catch (e) {
      screen.innerHTML = "";
      renderHome(screen);
    }
    app.appendChild(screen);
    window.scrollTo(0, 0);
  }

  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
