   색을 바꾸고 싶으면 맨 위 CONFIG의 accentColor, backgroundColor, darkColor를 바꿔 주세요.
   ========================================================== */
/* 휴대폰 다크 모드
   삼성 인터넷, Chrome 같은 브라우저는 다크 모드를 직접 처리하지 않는 사이트를 강제로 어둡게 칠합니다.
   이 앱은 "다크 모드도 직접 처리한다"고 알리고, 다크 모드에서도 같은 밝은 색을 씁니다. */
:root { color-scheme: light dark; }
@media (prefers-color-scheme: dark) {
  :root { color-scheme: light dark; }
  html, body { background: var(--page); color: var(--text); }
}

:root {
  --accent: #6B7F6A;
  --dark: #3D4A3E;
  --page: #F6F2EA;
  --text: #1F2220;
  --sub: #5E625E;
  --faint: #979A95;
  --line: #E7DFD2;
  --bg: #FFFDF9;
  --soft: #EDE6DA;
  --nav-h: 72px;
  --serif: "Noto Serif KR", "Noto Serif CJK KR", "Nanum Myeongjo", "AppleMyungjo", "Batang", "Hiragino Mincho ProN", "Songti TC", "Songti SC", Georgia, serif;
  --shadow: 0 2px 12px rgba(31, 34, 32, 0.05);
  --card: 14px;
  --btn: 8px;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--page);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Hiragino Sans", "PingFang TC", "PingFang SC", "Microsoft JhengHei", "Microsoft YaHei", "Noto Sans KR", sans-serif;
  font-size: 16px;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
button { -webkit-tap-highlight-color: transparent; }
.wrap {
  max-width: 480px;
  margin: 0 auto;
  padding: 16px 16px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom));
  min-height: 100vh;
}

/* 언어 고르기 */
.lang-pick { position: relative; z-index: 5; }
.hero .lang-pick { position: absolute; top: 14px; right: 14px; }
.lang-toggle {
  display: flex; align-items: center; gap: 6px;
  min-height: 44px; padding: 0 16px;
  border: 1px solid rgba(255, 255, 255, 0.7);
  border-radius: 22px;
  background: rgba(252, 252, 250, 0.92);
  color: var(--text);
  font-size: 16px; font-weight: 600; font-family: inherit;
  cursor: pointer; box-shadow: var(--shadow);
}
.page-top .lang-toggle { border-color: var(--line); box-shadow: none; }
.lang-toggle svg { width: 18px; height: 18px; }
.lang-menu {
  display: none; position: absolute; right: 0; top: 52px;
  min-width: 160px; padding: 6px;
  background: var(--bg); border: 1px solid var(--line);
  border-radius: var(--card);
  box-shadow: 0 8px 24px rgba(31, 34, 32, 0.14);
}
.lang-pick.open .lang-menu { display: block; }
.lang-item {
  display: block; width: 100%; min-height: 48px; padding: 0 14px;
  border: none; background: none; text-align: left;
  color: var(--text); font-size: 16px; font-family: inherit;
  border-radius: var(--btn); cursor: pointer;
}
.lang-item.on { background: var(--soft); font-weight: 700; }

/* 첫 화면 */
.hero { position: relative; margin: -16px -16px 0; }
.photo {
  width: 100%; aspect-ratio: 4 / 3.2; overflow: hidden;
  background: var(--soft);
  display: flex; align-items: center; justify-content: center;
}
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo .placeholder { color: var(--accent); font-size: 20px; font-weight: 600; padding: 16px; text-align: center; }
.hero::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 45%;
  background: linear-gradient(to bottom, rgba(246, 242, 234, 0), var(--page));
  pointer-events: none;
}
.hero-text { position: relative; z-index: 2; margin-top: -72px; padding: 0 4px; }
.tagline {
  font-family: var(--serif); font-size: 17px; color: var(--sub);
  margin: 0 0 6px; letter-spacing: 0.02em;
}
.stay-name {
  font-family: var(--serif); font-size: 34px; font-weight: 600;
  margin: 0 0 6px; line-height: 1.25; letter-spacing: -0.01em;
}
.summary { font-size: 16px; color: var(--sub); margin: 0 0 24px; }

/* 오늘 카드 */
.today {
  background: var(--dark); color: #F6F2EA;
  border-radius: var(--card);
  padding: 20px 18px;
  margin: 0 0 16px;
}
.today .greet { font-family: var(--serif); font-size: 21px; font-weight: 600; margin: 0; line-height: 1.35; }
.today .clock { font-size: 15px; color: rgba(246, 242, 234, 0.7); margin: 2px 0 16px; }
.today-times {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  padding: 14px 0; border-top: 1px solid rgba(246, 242, 234, 0.16);
}
.today-times .k { display: block; font-size: 14px; color: rgba(246, 242, 234, 0.65); }
.today-times .v { display: block; font-size: 18px; font-weight: 700; }
.today-wifi {
  display: flex; align-items: center; gap: 12px;
  padding-top: 14px; border-top: 1px solid rgba(246, 242, 234, 0.16);
}
.today-wifi .info { flex: 1 1 auto; min-width: 0; }
.today-wifi .k { display: block; font-size: 14px; color: rgba(246, 242, 234, 0.65); }
.today-wifi .v { display: block; font-size: 16px; font-weight: 600; font-family: ui-monospace, Menlo, Consolas, monospace; }
.today-wifi button {
  flex: 0 0 auto; min-height: 44px; padding: 0 16px;
  border: none; border-radius: 22px;
  background: #F6F2EA; color: var(--dark);
  font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer;
}

/* 홈 화면에 저장 */
.install {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 14px 14px 16px; margin: 0 0 24px;
  background: var(--soft); border-radius: var(--card);
}
.install-text { flex: 1 1 auto; min-width: 0; font-size: 16px; font-weight: 600; line-height: 1.45; }
.install-btn {
  flex: 0 0 auto; min-height: 48px; padding: 0 18px;
  border: none; border-radius: 24px;
  background: var(--dark); color: #F6F2EA;
  font-size: 16px; font-weight: 700; font-family: inherit; cursor: pointer;
}
.install-x {
  flex: 0 0 auto; width: 32px; height: 48px; margin-right: -6px;
  border: none; background: none; color: var(--faint);
  font-size: 22px; line-height: 1; cursor: pointer; font-family: inherit;
}

/* 목록 줄 */
.group-title {
  font-size: 15px; font-weight: 700; color: var(--sub);
  letter-spacing: 0.04em; margin: 28px 4px 10px;
}
.group-title:first-of-type { margin-top: 8px; }
.rows { display: grid; gap: 12px; }
.row {
  display: flex; align-items: center; gap: 16px;
  width: 100%; min-height: 84px; padding: 14px 16px;
  border: 1px solid var(--line); border-radius: var(--card);
  background: var(--bg); box-shadow: var(--shadow);
  color: var(--text); text-align: left; cursor: pointer;
  font-family: inherit; text-decoration: none;
}
.row:active { background: var(--soft); }
.row-icon {
  flex: 0 0 52px; width: 52px; height: 52px; border-radius: 50%;
  background: var(--dark);
  display: flex; align-items: center; justify-content: center;
  color: #F6F2EA;
}
.row-icon svg { width: 24px; height: 24px; }
.row-text { flex: 1 1 auto; min-width: 0; }
.row-title { display: block; font-size: 18px; font-weight: 700; line-height: 1.35; }
.row-sub { display: block; font-size: 15px; color: var(--faint); margin-top: 2px; line-height: 1.4; }
.row-arrow { flex: 0 0 auto; font-size: 22px; color: var(--faint); }
.footer { text-align: center; font-size: 14px; color: var(--faint); margin: 36px 0 0; }
.install-link { text-align: center; margin: 14px 0 0; }
.install-link button {
  min-height: 44px; padding: 0 12px; border: none; background: none;
  color: var(--accent); font-size: 15px; font-family: inherit;
  text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
}
.footer b { display: block; font-family: var(--serif); font-size: 16px; color: var(--sub); font-weight: 600; }

/* 안내 화면 */
.page-top { display: flex; align-items: center; justify-content: space-between; margin: 0 -4px 4px; }
.back {
  display: flex; align-items: center; gap: 4px; min-height: 48px; padding: 0 4px;
  border: none; background: none; color: var(--accent);
  font-size: 16px; font-weight: 600; cursor: pointer; font-family: inherit;
}
.back.bottom {
  width: 100%; justify-content: center; margin-top: 24px;
  border: 1px solid var(--line); border-radius: var(--btn); background: var(--bg);
}
.page-title {
  font-family: var(--serif); font-size: 26px; font-weight: 700;
  margin: 8px 0 8px; padding-left: 12px;
  border-left: 4px solid var(--accent); line-height: 1.3;
}
.page-desc { font-size: 16px; color: var(--sub); margin: 0 0 20px; padding-left: 16px; }
.card {
  background: var(--bg); border: 1px solid var(--line);
  border-radius: var(--card); box-shadow: var(--shadow);
  padding: 18px 16px; margin-bottom: 14px;
}
.card-title { font-size: 18px; font-weight: 700; margin: 0 0 8px; line-height: 1.4; }
.sec-group {
  font-size: 15px; font-weight: 700; color: var(--accent);
  letter-spacing: 0.04em; margin: 28px 4px 10px;
}
.label { font-size: 15px; color: var(--sub); margin: 0 0 4px; }
.value { font-size: 18px; font-weight: 600; margin: 0; }
.value.big { font-size: 22px; letter-spacing: 0.02em; }
.mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
.field + .field { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.small { font-size: 15px; color: var(--sub); margin: 4px 0 0; }
.note { font-size: 15px; color: var(--sub); margin: 10px 0 0; }
.note-box {
  font-size: 16px; margin: 12px 0 0; padding: 12px 14px;
  background: var(--page); border-radius: var(--btn);
}
.sec p { margin: 0 0 8px; }
.sec p:last-child { margin-bottom: 0; }
.lines { margin: 8px 0 0; padding: 0; list-style: none; }
.lines li { position: relative; padding-left: 14px; margin: 0 0 6px; }
.lines li::before {
  content: ""; position: absolute; left: 0; top: 0.72em;
  width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
}
.steps { margin: 8px 0 0; padding: 0; list-style: none; counter-reset: step; }
.steps li { position: relative; padding: 4px 0 8px 40px; counter-increment: step; }
.steps li::before {
  content: counter(step); position: absolute; left: 0; top: 2px;
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--dark); color: #F6F2EA;
  font-weight: 700; font-size: 14px;
  display: flex; align-items: center; justify-content: center;
}
.items { margin-top: 8px; }
.item { padding: 10px 0; border-top: 1px solid var(--line); }
.item:first-child { border-top: none; padding-top: 0; }
.item-title { display: block; font-weight: 700; margin-bottom: 2px; }
.item p { margin: 0; color: var(--sub); }
.kv { width: 100%; border-collapse: collapse; margin-top: 8px; }
.kv th, .kv td { text-align: left; padding: 10px 0; border-top: 1px solid var(--line); font-size: 16px; vertical-align: top; }
.kv tr:first-child th, .kv tr:first-child td { border-top: none; }
.kv th { font-weight: 600; color: var(--sub); padding-right: 12px; width: 50%; }
.gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.gallery:first-child { margin-top: 0; }
.gallery button { padding: 0; border: none; background: none; cursor: zoom-in; display: block; }
.gallery img {
  width: 100%; display: block; border-radius: var(--btn);
  border: 1px solid var(--line); background: var(--soft);
}
.gallery .wide, .gallery .only { grid-column: 1 / -1; }
.gallery.same img { aspect-ratio: 4 / 3; object-fit: cover; }
.gallery + p, .gallery + ul, .gallery + ol { margin-top: 12px; }
.btn {
  display: flex; align-items: center; justify-content: center;
  width: 100%; min-height: 52px; margin-top: 12px; padding: 12px 16px;
  border-radius: var(--btn); border: 1px solid var(--accent);
  background: var(--accent); color: #FFFFFF;
  font-size: 17px; font-weight: 600; text-decoration: none;
  cursor: pointer; font-family: inherit; text-align: center;
}
.btn.outline { background: var(--bg); color: var(--accent); }
.btn:active { opacity: 0.85; }
.btn-row { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 12px; }
.btn-row .btn { margin-top: 0; }
.qr { display: block; width: 180px; max-width: 70%; margin: 14px auto 6px; border-radius: var(--btn); }
.intro { font-size: 16px; color: var(--sub); margin: -8px 0 16px; padding-left: 16px; }

/* 접는 칸 */
details.card { padding: 0; overflow: hidden; }
details.card summary {
  list-style: none; display: flex; align-items: center; gap: 12px;
  min-height: 60px; padding: 14px 16px; cursor: pointer;
  font-size: 17px; font-weight: 700;
}
details.card summary::-webkit-details-marker { display: none; }
details.card summary span:first-child { flex: 1 1 auto; }
details.card .mark { flex: 0 0 auto; font-size: 22px; color: var(--faint); transition: transform 0.2s; font-weight: 400; }
details.card[open] .mark { transform: rotate(90deg); }
details.card .sec { padding: 14px 16px 16px; border-top: 1px solid var(--line); }

/* 사진 크게 보기 */
.viewer {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(20, 22, 21, 0.92);
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
}
.viewer img { max-width: 100%; max-height: 100%; border-radius: var(--btn); }
.viewer button {
  position: absolute; top: calc(12px + env(safe-area-inset-top)); right: 12px;
  width: 48px; height: 48px; border: none; border-radius: 50%;
  background: rgba(255, 255, 255, 0.15); color: #FFFFFF;
  font-size: 26px; cursor: pointer;
}

/* 아래 시트 */
.sheet-bg {
  position: fixed; inset: 0; z-index: 40;
  background: rgba(31, 34, 32, 0.45);
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet {
  width: 100%; max-width: 480px; background: var(--bg);
  border-radius: 20px 20px 0 0;
  padding: 24px 20px calc(20px + env(safe-area-inset-bottom));
}
.sheet h3 { font-family: var(--serif); font-size: 22px; margin: 0 0 14px; }
.sheet .steps li { border-bottom: 1px solid var(--line); padding: 10px 0 10px 40px; }
.sheet .steps li::before { top: 9px; }
.sheet .steps li:last-child { border-bottom: none; }

/* 아래 메뉴 바 */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  max-width: 480px; margin: 0 auto;
  display: grid; grid-template-columns: repeat(5, 1fr);
  height: calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  background: rgba(250, 250, 248, 0.97);
  border-top: 1px solid var(--line);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
.tab {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 4px; min-height: 48px; border: none; background: none; cursor: pointer;
  color: var(--faint); font-family: inherit; font-size: 12px; font-weight: 600;
  padding: 6px 2px; line-height: 1.2; text-align: center;
}
.tab svg { width: 24px; height: 24px; }
.tab.on { color: var(--dark); }
.tab.on span { font-weight: 800; }
.toast {
  position: fixed; left: 50%;
  bottom: calc(var(--nav-h) + 20px + env(safe-area-inset-bottom));
  transform: translateX(-50%) translateY(20px);
  background: var(--text); color: #FFFFFF;
  padding: 12px 20px; border-radius: var(--btn);
  font-size: 16px; max-width: calc(100% - 32px); text-align: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s, transform 0.2s; z-index: 60;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* 지도 (주변 맛집, 둘러보기) */
.map-wrap {
  position: relative; height: 340px; margin: 0 0 16px;
  border-radius: var(--card); overflow: hidden;
  border: 1px solid var(--line); background: var(--soft);
}
.map-wrap.off { display: none; }
.map { position: absolute; inset: 0; width: 100%; height: 100%; }
.map-recenter {
  position: absolute; right: 12px; bottom: 28px; z-index: 500;
  min-height: 44px; padding: 0 18px; border-radius: 22px;
  border: none; background: var(--bg); color: var(--text);
  font-size: 16px; font-weight: 700; font-family: inherit;
  box-shadow: 0 2px 10px rgba(31, 34, 32, 0.18); cursor: pointer;
}
.map .leaflet-tile-pane { filter: saturate(0.8) sepia(0.06); }
.leaflet-tooltip.stay-label {
  background: var(--dark); color: #F6F2EA; border: none; border-radius: 16px;
  padding: 5px 12px; font-size: 14px; font-weight: 700; font-family: inherit;
  box-shadow: 0 2px 6px rgba(31, 34, 32, 0.3); white-space: nowrap;
}
.leaflet-tooltip.stay-label::before { display: none; }
.pin {
  width: 34px; height: 34px; border-radius: 50%;
  border: 2px solid #FFFDF9; color: #FFFDF9;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 6px rgba(31, 34, 32, 0.35);
}
.pin svg { width: 18px; height: 18px; }
.pin.stay { width: 44px; height: 44px; border-width: 3px; }
.pin.stay svg { width: 22px; height: 22px; }
.leaflet-popup-content { margin: 12px 14px; font-family: inherit; font-size: 16px; line-height: 1.45; }
.leaflet-popup-content b, .nv-pop b { display: block; font-size: 16px; color: var(--text); }
.leaflet-popup-content span, .nv-pop span { display: block; color: var(--sub); font-size: 14px; }
.pop-more {
  margin-top: 8px; min-height: 40px; padding: 0 14px; width: 100%;
  border: none; border-radius: var(--btn); background: var(--dark); color: #F6F2EA;
  font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer;
}
.nv-pin { position: relative; }
.nv-label {
  position: absolute; bottom: 100%; left: 50%; transform: translate(-50%, -6px);
  background: var(--dark); color: #F6F2EA; border-radius: 16px;
  padding: 5px 12px; font-size: 14px; font-weight: 700; white-space: nowrap;
  box-shadow: 0 2px 6px rgba(31, 34, 32, 0.3);
}
.nv-pop {
  min-width: 200px; max-width: 260px; padding: 12px 14px;
  background: var(--bg); border-radius: var(--card);
  box-shadow: 0 6px 20px rgba(31, 34, 32, 0.22);
  font-size: 16px; line-height: 1.45; transform: translateY(-34px);
}
.chips {
  display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin: 0 0 16px;
  -webkit-overflow-scrolling: touch; scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto; min-height: 48px; padding: 0 16px;
  border: 1px solid var(--line); border-radius: 24px;
  background: var(--bg); color: var(--text);
  font-size: 16px; font-family: inherit; white-space: nowrap; cursor: pointer;
}
.chip.on { border-color: var(--accent); background: var(--accent); color: #FFFFFF; font-weight: 600; }
.card.flash { box-shadow: 0 0 0 3px var(--accent); }
/* 검색 */
.tools { display: flex; align-items: center; gap: 8px; }
.hero .tools { position: absolute; top: 14px; right: 14px; z-index: 5; }
.hero .tools .lang-pick { position: relative; top: auto; right: auto; }
.search-btn {
  display: flex; align-items: center; justify-content: center;
  width: 44px; height: 44px; padding: 0; flex: none;
  border: 1px solid rgba(255, 255, 255, 0.7); border-radius: 50%;
  background: rgba(252, 252, 250, 0.92); color: var(--text);
  box-shadow: var(--shadow); cursor: pointer;
}
.page-top .search-btn { border-color: var(--line); box-shadow: none; background: var(--bg); }
.search-btn svg { width: 20px; height: 20px; }
.search-title-h { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.25; margin: 12px 0 18px; }
.search-box { position: relative; }
.search-ic { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--faint); display: flex; pointer-events: none; }
.search-ic svg { width: 20px; height: 20px; }
.search-input {
  width: 100%; min-height: 60px; padding: 0 18px 0 50px;
  border: 2px solid var(--text); border-radius: 18px; background: var(--bg); color: var(--text);
  font-size: 18px; font-family: inherit; -webkit-appearance: none; appearance: none;
}
.search-input:focus { outline: none; border-color: var(--accent); }
.search-input::placeholder { color: var(--faint); }
.search-input::-webkit-search-cancel-button { -webkit-appearance: none; }
.search-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 8px; }
.search-chips .chip { min-height: 44px; }
.search-results { margin-top: 12px; }
.search-count { font-size: 14px; color: var(--sub); margin: 8px 4px 10px; }
.search-item {
  display: flex; flex-direction: column; align-items: flex-start; gap: 3px; width: 100%;
  text-align: left; padding: 14px 16px; margin-bottom: 10px;
  background: var(--bg); border: 1px solid var(--line); border-radius: var(--card);
  color: var(--text); font-family: inherit; cursor: pointer;
}
.search-item:active { background: var(--soft); }

  function naverMap(pm) {
    var nm = window.naver.maps, st = stayPos();
    var map = new nm.Map(pm.el, {
      center: new nm.LatLng(st.lat, st.lng), zoom: BASE.mapZoom || 16,

    var label = '<div class="nv-label">' + String(C.stayName || "").replace(/[<>&]/g, "") + "</div>";
    new nm.Marker({ position: new nm.LatLng(st.lat, st.lng), map: map, zIndex: 1000, title: C.stayName,

  function leafletMap(pm) {

  /* 지도와 분류 버튼을 만듭니다. nodes 는 아래에 나올 칸들입니다 */
  function placeMap(p, nodes) {
    var styles = arr(p.mapStyles);
    var groups = [], points = [];
    arr(p.sections).forEach(function (s, i) {
      if (s.group) groups.push(s.group);
      var g = groups.length - 1;
      var sty = styles[Math.max(g, 0)] || styles[0] || { icon: "nearby", color: "#5C6B78" };
      if (s.place && typeof s.place.lat === "number") {
        points.push({ i: i, g: g, lat: s.place.lat, lng: s.place.lng, name: s.title || "",
          sub: arr(s.text)[0] || "", icon: sty.icon, color: sty.color });
      }
    });
    if (!points.length) return [];
    var wrap = el("div", { cls: "map-wrap" }), mapEl = el("div", { cls: "map" });
    wrap.appendChild(mapEl);
    var pm = { wrap: wrap, el: mapEl, points: points, filter: -1, map: null, provider: "" };
    pm.reset = function () {
      pm.el.innerHTML = ""; pm.map = null; pm.provider = "";
      Array.prototype.slice.call(pm.wrap.querySelectorAll(".map-recenter")).forEach(function (b) { b.remove(); });
    };
    pm.apply = function () {
      var shown = [];
      points.forEach(function (pt) { var on = pm.filter === -1 || pt.g === pm.filter; if (pm.show) pm.show(pt, on); if (on) shown.push(pt); });
      if (pm.closePopup) pm.closePopup();
      if (pm.fit && shown.length) pm.fit(shown);
    };
    var out = [wrap];
    if (p.mapChips && groups.length > 1) {
      var chips = el("div", { cls: "chips" });
      var names = [X("mapAll")].concat(groups);
      pm.setFilter = function (f) {
        pm.filter = f;
        Array.prototype.slice.call(chips.children).forEach(function (b, k) { b.classList.toggle("on", k - 1 === f); });
        nodes.forEach(function (n) {
          var g = n.getAttribute && n.getAttribute("data-g");
          if (g == null) return;
          n.classList.toggle("hide", f !== -1 && Number(g) !== f);
        });
        pm.apply();
      };
      names.forEach(function (nm, k) {
        chips.appendChild(el("button", { cls: "chip" + (k === 0 ? " on" : ""), type: "button", text: nm, onclick: function () { pm.setFilter(k - 1); } }));
      });
      out.push(chips);
    }
    pmap = pm;
    setTimeout(function () { if (pmap === pm && document.body.contains(wrap)) startMap(pm); }, 30);
    return out;
  }

  };
  /* 빠른 검색 버튼: 결과가 있는 것만 보입니다. terms 가운데 하나라도 들어 있으면 찾습니다 */
  var SEARCH_CHIPS = {
    "ko": [["체크인", ["체크인"]], ["와이파이", ["와이파이", "wifi"]], ["주차", ["주차"]], ["짐 보관", ["짐 보관", "짐보관"]], ["세탁", ["세탁", "건조기"]], ["난방", ["난방", "보일러"]], ["에어컨", ["에어컨"]], ["쓰레기", ["쓰레기", "분리수거"]], ["체크아웃", ["체크아웃"]], ["맛집", ["맛집"]], ["카페", ["카페"]], ["공항", ["공항"]], ["긴급", ["긴급", "119"]]],
    "en": [["Check-in", ["check-in", "checkin"]], ["Wi-Fi", ["wifi"]], ["Parking", ["parking"]], ["Luggage", ["luggage"]], ["Laundry", ["laundry", "washer", "dryer", "washing"]], ["Heating", ["heating", "boiler"]], ["Air conditioner", ["air conditioner", "aircon", "a/c"]], ["Trash", ["trash", "recycling", "garbage", "waste"]], ["Check-out", ["check-out", "checkout"]], ["Food", ["places to eat", "restaurant", "food"]], ["Cafe", ["cafe", "café", "coffee"]], ["Airport", ["airport"]], ["Emergency", ["emergency", "119"]]],
    "ja": [["チェックイン", ["チェックイン"]], ["Wi-Fi", ["wifi", "ワイファイ"]], ["駐車", ["駐車"]], ["荷物", ["荷物"]], ["洗濯", ["洗濯", "乾燥機"]], ["暖房", ["暖房", "ボイラー", "床暖"]], ["エアコン", ["エアコン"]], ["ゴミ", ["ゴミ", "ごみ", "分別"]], ["チェックアウト", ["チェックアウト"]], ["グルメ", ["グルメ", "飲食店", "レストラン"]], ["カフェ", ["カフェ"]], ["空港", ["空港"]], ["緊急", ["緊急", "119"]]],
    "zh-CN": [["入住", ["入住"]], ["Wi-Fi", ["wifi", "无线网"]], ["停车", ["停车"]], ["行李", ["行李"]], ["洗衣", ["洗衣", "烘干"]], ["暖气", ["暖气", "地暖", "锅炉"]], ["空调", ["空调"]], ["垃圾", ["垃圾", "分类"]], ["退房", ["退房"]], ["美食", ["美食", "餐厅"]], ["咖啡", ["咖啡"]], ["机场", ["机场"]], ["紧急", ["紧急", "119"]]],
    "zh-TW": [["入住", ["入住"]], ["Wi-Fi", ["wifi", "無線網"]], ["停車", ["停車"]], ["行李", ["行李"]], ["洗衣", ["洗衣", "烘乾"]], ["暖氣", ["暖氣", "地暖", "鍋爐"]], ["冷氣", ["冷氣", "空調"]], ["垃圾", ["垃圾", "分類"]], ["退房", ["退房"]], ["美食", ["美食", "餐廳"]], ["咖啡", ["咖啡"]], ["機場", ["機場"]], ["緊急", ["緊急", "119"]]]
  };
  function ST(k) { var d = SEARCH_TEXT[LANG] || SEARCH_TEXT.en; return d[k]; }
  function norm(s) { return String(s || "").toLowerCase().replace(/[\s\-·・_.,，、]+/g, ""); }
  var searchIndex = null, searchIndexLang = "", searchQuery = "", searchTarget = null;

  function buildSearchIndex() {
    if (searchIndex && searchIndexLang === LANG) return searchIndex;
    var list = [];
    function textOf(n) {
      var w = document.createTreeWalker(n, NodeFilter.SHOW_TEXT, null), parts = [], t;
      while ((t = w.nextNode())) { if (t.parentNode && t.parentNode.tagName === "BUTTON") continue; parts.push(t.nodeValue); }
      return parts.join(" ").replace(/\s+/g, " ").trim();
    }
    function push(route, pageTitle, title, body, sel) {
      if (!title && !body) return;
      list.push({ route: route, page: pageTitle, title: title || pageTitle, body: body || "", sel: sel,
        nt: norm(title), nb: norm(body) });
    }
    /* 기본 화면 (체크인, 와이파이, 연락하기, Uber): 화면을 만들어 보고 카드마다 글을 모읍니다 */
    ["checkin", "wifi", "uber", "contact", "experiences"].forEach(function (id) {
      var e = entry(id); if (!e) return;
      var view = { checkin: viewCheckin, wifi: viewWifi, uber: viewUber, contact: viewContact, experiences: viewExperiences }[id];
      var keepF = expFilter; expFilter = "all";
      var box = el("div", null, view());
      expFilter = keepF;
      var head = { body: [e.sub || ""] }, cards = [];
      Array.prototype.slice.call(box.querySelectorAll(".card")).forEach(function (c, k) {
        var h = c.querySelector(".card-title, summary span, .label");
        var title = h ? textOf(h) : e.title;
        var body = textOf(c).replace(title, "").trim();
        if (title === e.title) head.body.push(body);
        else cards.push([title, body, k]);
      });
      push(id, e.title, e.title, head.body.join(" "), null);
      cards.forEach(function (c) { push(id, e.title, c[0], c[1], { nth: c[2] }); });
    });
    /* 안내 페이지: 글 데이터에서 바로 모읍니다 */
    arr(C.pages).forEach(function (p) {
      var pt = p.menu || p.title || "";
      push(p.id, pt, pt, [p.desc, p.intro].filter(Boolean).join(" "), null);
      arr(p.sections).forEach(function (s, si) {
        var parts = [s.group].concat(arr(s.text), arr(s.list), arr(s.steps),
          arr(s.items).map(function (it) { return (it.title || "") + " " + (it.text || ""); }),
          arr(s.table).map(function (r) { return arr(r).join(" "); }), [s.note]);
        push(p.id, pt, s.title || pt, parts.filter(Boolean).join(" "), { i: si });
      });
    });
    searchIndex = list; searchIndexLang = LANG;
    return list;
  }

  function runSearch(q, terms) {
    var idx = buildSearchIndex();
    var words = terms ? terms.map(norm) : String(q || "").split(/\s+/).map(norm).filter(Boolean);
    if (!words.length) return [];
    var any = !!terms;
    var out = [];
    idx.forEach(function (r) {
      var score = 0, ok = any ? false : true;
      words.forEach(function (w) {
        var inT = r.nt.indexOf(w) >= 0, inB = r.nb.indexOf(w) >= 0;
        if (inT || inB) { if (any) ok = true; score += inT ? 3 : 1; }
        else if (!any) ok = false;
      });
      if (ok) out.push({ r: r, s: score + (r.sel ? 0 : 0.5) });
    });
    out.sort(function (a, b) { return b.s - a.s; });
    return out.slice(0, 40).map(function (x) { return x.r; });
  }

  function snippet(r, words) {
    var body = r.body;
    if (!body) return "";
    var low = body.toLowerCase(), at = -1;
    words.forEach(function (w) { if (at < 0 && w) { var j = low.indexOf(w.toLowerCase()); if (j >= 0) at = j; } });
    if (at < 0) return body.length > 70 ? body.slice(0, 70) + "…" : body;
    var start = Math.max(0, at - 24);
    var s = (start > 0 ? "…" : "") + body.slice(start, start + 80);
    return body.length > start + 80 ? s + "…" : s;
  }
  function marked(text, words) {
    var frag = document.createDocumentFragment();
    var ws = words.filter(Boolean).map(function (w) { return w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); });
    if (!ws.length) { frag.appendChild(document.createTextNode(text)); return frag; }
    var re = new RegExp("(" + ws.join("|") + ")", "ig");
    String(text).split(re).forEach(function (part, i) {
      if (!part) return;
      if (i % 2) frag.appendChild(el("mark", { text: part }));
      else frag.appendChild(document.createTextNode(part));
    });
    return frag;
  }

  function openResult(r) {
    searchTarget = r.sel ? { route: r.route, sel: r.sel } : null;
    if ((location.hash || "").replace(/^#/, "") === r.route) { render(); window.scrollTo(0, 0); }
    else go(r.route);
  }
  function revealTarget() {
    var t = searchTarget; searchTarget = null;
    if (!t) return;
    var cards = Array.prototype.slice.call(app.querySelectorAll("main .card"));
    var c = t.sel.i != null ? app.querySelector('main .card[data-i="' + t.sel.i + '"]') : cards[t.sel.nth];
    if (!c) return;
    if (c.tagName === "DETAILS") c.open = true;
    c.classList.remove("hide");
    var y = c.getBoundingClientRect().top + window.pageYOffset - 16;
    window.scrollTo({ top: y, behavior: "smooth" });
    c.classList.add("flash");
    setTimeout(function () { c.classList.remove("flash"); }, 1800);
  }

  function searchButton() {
    var b = el("button", { cls: "search-btn", type: "button", "aria-label": ST("btn"), onclick: function () { go("search"); } });
    b.innerHTML = svg('<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>');
    return b;
  }

  function viewSearch() {
    var input = el("input", { cls: "search-input", type: "search", placeholder: ST("ph"), "aria-label": ST("title"), enterkeyhint: "search", autocomplete: "off" });
    input.value = searchQuery;
    var chipBox = el("div", { cls: "search-chips" });
    var results = el("div", { cls: "search-results", "aria-live": "polite" });
    var activeTerms = null;

    function draw() {
      var q = input.value.trim();
      searchQuery = input.value;
      results.innerHTML = "";
      Array.prototype.slice.call(chipBox.children).forEach(function (b) { b.classList.toggle("on", b._label === q && !!activeTerms); });
      if (!q) return;
      var words = activeTerms || q.split(/\s+/);
      var found = runSearch(q, activeTerms);
      if (!found.length) {
        results.appendChild(el("div", { cls: "search-empty" }, [
          el("p", { text: ST("none") }),
          el("button", { cls: "btn outline", type: "button", text: ST("ask"), onclick: function () { go("contact"); } })
        ]));
        return;
      }
      results.appendChild(el("p", { cls: "search-count", text: fill(ST("count"), { n: found.length }) }));
      found.forEach(function (r) {
        var b = el("button", { cls: "search-item", type: "button", onclick: function () { openResult(r); } });
        b.appendChild(el("span", { cls: "search-page", text: r.page }));
        var t = el("span", { cls: "search-title" }); t.appendChild(marked(r.title, words)); b.appendChild(t);
        var sn = snippet(r, words);
        if (sn) { var s = el("span", { cls: "search-snip" }); s.appendChild(marked(sn, words)); b.appendChild(s); }
        results.appendChild(b);
      });
    }

    arr(SEARCH_CHIPS[LANG] || SEARCH_CHIPS.en).forEach(function (c) {
      if (!runSearch("", c[1]).length) return;
      var b = el("button", { cls: "chip", type: "button", text: c[0], onclick: function () {
        input.value = c[0]; activeTerms = c[1]; draw();
      } });
      b._label = c[0];
      chipBox.appendChild(b);
    });
    input.addEventListener("input", function () { activeTerms = null; draw(); });
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") input.blur(); });
    /* 돌아왔을 때 빠른 버튼으로 찾던 것이면 다시 그 방식으로 */
    arr(SEARCH_CHIPS[LANG]).forEach(function (c) { if (c[0] === searchQuery.trim()) activeTerms = c[1]; });

    var form = el("div", { cls: "search-box" }, [input]);
    var ic = el("span", { cls: "search-ic", "aria-hidden": "true" }); ic.innerHTML = svg('<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>');
    form.insertBefore(ic, input);
    setTimeout(function () { draw(); if (!searchQuery) input.focus(); }, 0);
    return [
      el("div", { cls: "page-top" }, [
        el("button", { cls: "back", type: "button", onclick: function () { go(""); }, text: "‹ " + (ST("home") || "") }),
        langPicker()
      ]),
      el("h2", { cls: "search-title-h", text: ST("title") }),
      form, chipBox, results
    ];
  }

  /* ---------- 화면 바꾸기 ---------- */
  function render() {
    var id = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    var nodes, cur = id;
    if (!id) nodes = viewHome();
    else if (id === "checkin") nodes = viewCheckin();
    else if (id === "wifi") nodes = viewWifi();
    else if (id === "contact") nodes = viewContact();
    else if (id === "search") nodes = viewSearch();
    else if (id === "experiences") { if (searchTarget && searchTarget.route === "experiences") expFilter = "all"; nodes = viewExperiences(); }
    else if (id === "uber" && BASE.showUber !== false) nodes = viewUber();
    else {
      var p = pageById(id);
      if (p) nodes = viewPage(p);
      else { nodes = viewHome(); cur = ""; }
    }
    document.title = id === "search" ? ST("btn") + " · " + (C.stayName || "") : id && cur ? ((entry(id) || {}).title || "") + " · " + (C.stayName || "") : (C.stayName || "");
    var main = el("main", { cls: "wrap" }, nodes);
    app.innerHTML = "";
    app.appendChild(main);
    app.appendChild(tabbar(cur));
    if (searchTarget && searchTarget.route === id) setTimeout(revealTarget, 60);
  }
  /* 확인 화면: 첫 화면 맨 아래 숙소 이름을 5번 누르면 휴대폰 정보가 나옵니다 (문제 찾기용) */
  var BUILD = "2026-10-31b";
  var tapCount = 0, tapTimer = null;
  document.addEventListener("click", function (e) {
    if (!e.target.closest || !e.target.closest(".footer")) return;
    tapCount++; clearTimeout(tapTimer); tapTimer = setTimeout(function () { tapCount = 0; }, 1500);
    if (tapCount < 5) return;
    tapCount = 0;
    var mm = function (q) { try { return window.matchMedia(q).matches ? "yes" : "no"; } catch (x) { return "?"; } };
    var ua = navigator.userAgent || "";
    var browser = /SamsungBrowser\/([\d.]+)/.test(ua) ? "Samsung Internet " + RegExp.$1
      : /KAKAOTALK/i.test(ua) ? "KakaoTalk" : /NAVER/.test(ua) ? "Naver"
      : /Chrome\/([\d.]+)/.test(ua) ? "Chrome " + RegExp.$1 : /Safari/.test(ua) ? "Safari" : "?";
    var cs = document.querySelector('meta[name="color-scheme"]');
    var info = [
      "build: " + BUILD,
      "browser: " + browser,
      "dark mode: " + mm("(prefers-color-scheme: dark)"),
      "home app: " + (isStandalone() ? "yes" : "no"),
      "color-scheme: " + (cs ? cs.getAttribute("content") : "-"),
      "bg: " + getComputedStyle(document.body).backgroundColor,
      ua
    ].join("\n");
    var box = el("pre", { style: "white-space:pre-wrap;word-break:break-all;font-size:12px;line-height:1.5;background:#fff;color:#222;border:1px solid #ccc;border-radius:8px;padding:12px;margin:12px 0", text: info });
    e.target.closest(".footer").after(box);
  });

  window.addEventListener("hashchange", function () { render(); window.scrollTo(0, 0); });
  render();

  /* 홈 화면 저장과 인터넷 없이 열기에 필요한 장치 */
  if ("serviceWorker" in navigator && /^https?:/.test(location.protocol)) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
})();
</script>
